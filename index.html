<html lang="en">
<head>

    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        canvas { width: 100vw; height: 100vh; }
        /* Hides the control menu */
        .dg.ac { display: none !important; }

</head>
<body>
    <canvas></canvas>
    
    <!-- Load the untouched, original math engine -->
    <script src="script.js"></script>
    
    <!-- Force the neon casino colors safely -->
    <script>
        window.generateColor = function () {
            // 0.5 = Cyan, 0.85 = Hot Pink, 0.75 = Deep Purple
            const neonHues = [0.5, 0.85, 0.75]; 
            let lockedHue = neonHues[Math.floor(Math.random() * neonHues.length)];
            
            let c = window.HSVtoRGB(lockedHue, 1.0, 1.0);
            
            c.r *= 0.15;
            c.g *= 0.15;
            c.b *= 0.15;
            
            return c;
        };
    </script>
</body>
